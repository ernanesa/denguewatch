services:
  mongo:
    image: mongo:8.3.11
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - mongo-data:/data/db
    networks:
      - denguewatch

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      MongoSettings__ConnectionString: "mongodb://mongo:27017"
      MongoSettings__DatabaseName: "denguewatch"
    ports:
      - "5000:8080"
    networks:
      - denguewatch

networks:
  denguewatch:

volumes:
  mongo-data:
